name: Deploy Zerana to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_live_mapbox:
        description: 'Run one live Paris preview check (maximum 48 Mapbox requests; potentially billable)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment:
      name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json
      - run: npm ci
      - run: npm ci --prefix v2 --ignore-scripts
      - name: Validate CPU contracts and deployment guards
        run: npm --prefix v2 run check
      - name: Build V1 and isolated V2 preview
        env:
          VITE_MAPBOX_API_KEY: ${{ secrets.VITE_MAPBOX_API_KEY }}
        run: node scripts/build-pages.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install -r v2/tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate combined site without real provider calls
        run: python v2/tests/browser/preview_smoke.py
      - name: Validate metric player before publication
        run: python v2/tests/browser/player_smoke.py
      - name: Validate streaming with mocked provider before publication
        run: python v2/tests/browser/streaming_smoke.py
      - name: Validate sliding window and recycling before publication
        run: python v2/tests/browser/sliding_window_smoke.py
      - name: Validate automatic experience and prepared colliders
        env:
          ZERANA_SOAK_SECONDS: '120'
        run: python v2/tests/browser/experience_smoke.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-published:
    name: Verify published V1 and V2
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install -r v2/tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify public site and optional bounded live provider access
        env:
          ZERANA_PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}v2/
          ZERANA_EXPECTED_SHA: ${{ github.sha }}
          # A controlled merge marker enables ONE live verification for this release.
          # Ordinary pushes make no Mapbox calls. workflow_dispatch is opt-in as well.
          ZERANA_LIVE_MAPBOX: ${{ (github.event.inputs.verify_live_mapbox == 'true' || contains(github.event.head_commit.message, '[verify-mapbox]')) && '1' || '0' }}
        run: python v2/tests/browser/preview_smoke.py
      - name: Verify published player without provider calls
        env:
          ZERANA_PLAYER_URL: ${{ needs.deploy.outputs.page_url }}v2/
          ZERANA_EXPECTED_SHA: ${{ github.sha }}
        run: python v2/tests/browser/player_smoke.py
      - name: Verify published streaming with mocked provider responses
        env:
          ZERANA_PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}v2/
          ZERANA_EXPECTED_SHA: ${{ github.sha }}
        run: python v2/tests/browser/streaming_smoke.py
      - name: Verify published sliding window with mocked provider responses
        env:
          ZERANA_PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}v2/
          ZERANA_EXPECTED_SHA: ${{ github.sha }}
        run: python v2/tests/browser/sliding_window_smoke.py
      - name: Verify automatic experience on the published domain
        env:
          ZERANA_PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}v2/
          ZERANA_EXPECTED_SHA: ${{ github.sha }}
          ZERANA_SOAK_SECONDS: '120'
        run: python v2/tests/browser/experience_smoke.py
      - name: One bounded real Mapbox streaming verification
        if: contains(github.event.head_commit.message, '[verify-stream-live]')
        env:
          ZERANA_PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}v2/
          ZERANA_EXPECTED_SHA: ${{ github.sha }}
          ZERANA_LIVE_STREAM: '1'
          ZERANA_EXPECTED_TOKEN_SHA256: '9a1c9c843f9a77e5fcb98cb69f6267139fd9c547abf483c60326f4aa9316c0bc'
        run: python v2/tests/browser/experience_smoke.py
      - name: Retain sanitized public verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-preview-verification
          path: |
            v2/browser-results/preview/
            v2/browser-results/player/
            v2/browser-results/streaming/
            v2/browser-results/sliding-window/
            v2/browser-results/experience/
            v2/browser-results/experience-live/
          retention-days: 7
          if-no-files-found: warn
