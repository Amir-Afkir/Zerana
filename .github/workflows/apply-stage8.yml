name: Stage 8 verified source transfer
on:
  push:
    branches: [work/stage8-source-snapshot]
    paths: [.github/workflows/apply-stage8.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed patch
        run: |
          cp .stage8-transfer/update.patch "$RUNNER_TEMP/stage8.patch"
          echo '75aed0785935092285463ccd0e40532362e501f6fba897434c1ec42f6d73a5e8  '"$RUNNER_TEMP/stage8.patch" | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: work/stage8-implementation
          path: target
          fetch-depth: 0
      - name: Apply only to the isolated implementation branch
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ea9d54b1f9b552fea304160be5943e070cd9a567
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/stage8.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/stage8.patch"
          git diff --cached --check
          test "$(git write-tree)" = 97b24277c255d342833a870fd0ceb75cab08e6be
          git config user.name 'Zerana source transfer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v2): bound visited-cell diagnostics to retained residency'
          git push origin HEAD:refs/heads/work/stage8-implementation
