name: Stage 8 verified source transfer
on:
  push:
    branches: [work/stage8-source-snapshot]
    paths: [.github/workflows/apply-stage8.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed patch
        run: |
          cp .stage8-transfer/update.patch "$RUNNER_TEMP/stage8.patch"
          echo 'b037671389fee14fd88c127575635b0ec5786eb076593f7bedf07d92c07c34ca  '"$RUNNER_TEMP/stage8.patch" | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: work/stage8-implementation
          path: target
          fetch-depth: 0
      - name: Apply only to the isolated implementation branch
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d1c7891bcb18f381fe3260c37febfac5f0bf3708
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/stage8.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/stage8.patch"
          git diff --cached --check
          test "$(git write-tree)" = e9ac8f305be48a6713a10d1bec87b53ff2ab6b09
          git config user.name 'Zerana source transfer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(v2): keep one eviction cleanup and retain the residency assertion'
          git push origin HEAD:refs/heads/work/stage8-implementation
