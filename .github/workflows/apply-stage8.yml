name: Stage 8 verified source transfer
on:
  push:
    branches: [work/stage8-source-snapshot]
    paths: [.github/workflows/apply-stage8.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact reviewed patch
        run: |
          cat .stage8-transfer/*.patch > "$RUNNER_TEMP/stage8.patch"
          echo 'fbadf09bd3e8f66fe35aa59abdfe3b8caa50f481a5daa468100a9ce11c597c5d  '"$RUNNER_TEMP/stage8.patch" | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: work/stage8-implementation
          path: target
          fetch-depth: 0
      - name: Apply only to the isolated implementation branch
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e83dd50d96c205733e98b1779711a6f40287f175
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/stage8.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/stage8.patch"
          git diff --cached --check
          test "$(git write-tree)" = effcf429bcb130189ffce5f667b276d3a105c1c6
          git config user.name 'Zerana source transfer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v2): staged collider admission, progressive imagery and direct exploration'
          git push origin HEAD:refs/heads/work/stage8-implementation
