name: Stage 11 recovered source
on:
  push:
    branches: [work/stage11-baseline]
    paths: ['.github/workflows/stage11-finish-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d88e726cef5ffea179f6d511b07ad5b51bb5c338
          persist-credentials: false
      - name: Export exact source
        run: |
          git archive --format=tar.gz HEAD -o /tmp/zerana-stage11-recovered.tar.gz
          git rev-parse HEAD > /tmp/zerana-stage11-recovered.sha
      - uses: actions/upload-artifact@v4
        with:
          name: stage11-recovered-source
          path: |
            /tmp/zerana-stage11-recovered.tar.gz
            /tmp/zerana-stage11-recovered.sha
          retention-days: 2
