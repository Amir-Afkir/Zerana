name: Hydro levels checksum-verified source transfer
on:
  push:
    branches: [work/pr15b-levels-source]
    paths: [.transfer/**, .github/workflows/hydro-levels-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate payload and pinned destination
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(pathlib.Path('.transfer/refine.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='f49285d4bffeff1b9cb17c874edcc8d208a8105b292e732ef1c44e7096b7a97a'
          pathlib.Path('/tmp/hydro-levels.patch').write_bytes(patch)
          PY
          git fetch origin fix/pr15b-water-levels
          test "$(git rev-parse FETCH_HEAD)" = b90f1361acb4b1b0e860cafaae4fd3b4f2faf751
          git checkout -B fix/pr15b-water-levels FETCH_HEAD
          git apply --unidiff-zero --index /tmp/hydro-levels.patch
          test "$(git write-tree)" = 583be925cb7dbb222d4e3669f73598de70ce5e00
          git diff --cached --check
          git config user.name 'Amir-Afkir'
          git config user.email 'afkir202@gmail.com'
          git commit -m 'fix(v2): localize hydro bounds and guard collision-projected streaming exits'
          git push origin HEAD:refs/heads/fix/pr15b-water-levels
