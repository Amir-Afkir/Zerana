name: Hydro levels checksum-verified source transfer
on:
  push:
    branches: [work/pr15b-levels-source]
    paths: [.transfer/**, .github/workflows/hydro-levels-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate payload and pinned destination
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          text=''.join(pathlib.Path(f'.transfer/hydro-{i}.b64').read_text().strip() for i in range(8))
          patch=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='7849e5bc153922aaac3b74157192416448773977c22ec9f56bce17811bebe1a1'
          pathlib.Path('/tmp/hydro-levels.patch').write_bytes(patch)
          PY
          git fetch origin fix/pr15b-water-levels
          test "$(git rev-parse FETCH_HEAD)" = decc600b24c8eba1c565a74fa8f9a7c2d9a06cae
          git checkout -B fix/pr15b-water-levels FETCH_HEAD
          git apply --unidiff-zero --index /tmp/hydro-levels.patch
          test "$(git write-tree)" = 2c8273e1ce1a62d471d93d75c8c63902d28a8072
          git restore --source=HEAD --staged --worktree .github/workflows/pr15b-live-review.yml
          test "$(git write-tree)" = fa81666977f44dddb4e40318b63fd1118a76daaa
          git diff --cached --check
          git config user.name 'Amir-Afkir'
          git config user.email 'afkir202@gmail.com'
          git commit -m 'fix(v2): constrain hydro levels upstream and measure water from player view'
          git push origin HEAD:refs/heads/fix/pr15b-water-levels
