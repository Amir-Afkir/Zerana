name: Hydro levels checksum-verified source transfer
on:
  push:
    branches: [work/pr15b-levels-source]
    paths: [.transfer/**, .github/workflows/hydro-levels-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate payload and pinned destination
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(pathlib.Path('.transfer/camera.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='358e7c4c509eefedf037ac2aa0ddc567630720e6461e22bf4a4ebc949d0d963f'
          pathlib.Path('/tmp/hydro-levels.patch').write_bytes(patch)
          PY
          git fetch origin fix/pr15b-water-levels
          test "$(git rev-parse FETCH_HEAD)" = ce5caf63c711d524590998937ab61b60de5f5486
          git checkout -B fix/pr15b-water-levels FETCH_HEAD
          git apply --unidiff-zero --index /tmp/hydro-levels.patch
          test "$(git write-tree)" = a8bc7338c1262f65e0290732e96dd32cb92d1b4f
          git diff --cached --check
          git config user.name 'Amir-Afkir'
          git config user.email 'afkir202@gmail.com'
          git commit -m 'test(v2): face the river in human-camera visibility regression'
          git push origin HEAD:refs/heads/fix/pr15b-water-levels
