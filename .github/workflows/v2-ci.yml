name: Zerana V2 - Geo Kernel and Terrain CI

on:
  pull_request:
    branches: [main, 'feature/v2-*']
  push:
    branches: [main, 'feature/v2-*']

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geo-kernel:
    name: Geo and terrain - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  legacy-build:
    name: Current game - Pages build only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile existing game without production credentials
        run: npm run build
        env:
          VITE_MAPBOX_API_KEY: pk.ci-placeholder-not-a-valid-token
      - name: Verify Pages asset paths
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('dist/index.html', 'utf8');
          const paths = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m => m[1]);
          assert(paths.length >= 2, 'Expected JS and CSS assets');
          for (const path of paths) {
            assert(path.startsWith('/Zerana/'), `Invalid Pages prefix: ${path}`);
            assert(existsSync(`dist/${path.slice('/Zerana/'.length)}`), `Missing asset: ${path}`);
          }
          const model = readFileSync('dist/models/DefaultAvatarPC.glb');
          assert.equal(model.subarray(0, 4).toString(), 'glTF');
          console.log('Current game build and Pages asset paths verified. No deployment performed.');
          JS

  terrain-browser:
    name: Synthetic terrain - browser and Pages prefix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build isolated demo with existing locked Vite and Three.js
        run: npm --prefix v2 run demo:build
      - name: Install browser test dependency
        run: |
          python -m pip install -r v2/tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test built demo on a real HTTP subpath
        run: npm --prefix v2 run demo:test
      - name: Retain browser evidence and standalone demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-terrain-demo-and-evidence
          path: |
            v2/demo-dist/
            v2/browser-results/
          retention-days: 7
          if-no-files-found: warn
