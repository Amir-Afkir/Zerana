name: Zerana V2 - Integrated Preview CI

on:
  pull_request:
    branches: [main, 'feature/v2-*']
  push:
    branches: [main, 'feature/v2-*']

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geo-kernel:
    name: Geo terrain raster - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  legacy-build:
    name: Current game - Pages build only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile existing game without production credentials
        run: npm run build
        env:
          VITE_MAPBOX_API_KEY: pk.ci-placeholder-not-a-valid-token
      - name: Verify Pages asset paths
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('dist/index.html', 'utf8');
          const paths = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m => m[1]);
          assert(paths.length >= 2, 'Expected JS and CSS assets');
          for (const path of paths) {
            assert(path.startsWith('/Zerana/'), `Invalid Pages prefix: ${path}`);
            assert(existsSync(`dist/${path.slice('/Zerana/'.length)}`), `Missing asset: ${path}`);
          }
          const model = readFileSync('dist/models/DefaultAvatarPC.glb');
          assert.equal(model.subarray(0, 4).toString(), 'glTF');
          JS

  terrain-browser:
    name: Combined preview - browser and Pages prefix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build combined V1 and V2 without production credentials
        env:
          VITE_MAPBOX_API_KEY: pk.ci-placeholder-not-a-valid-token
        run: node scripts/build-pages.mjs
      - name: Install browser test dependency
        run: |
          python -m pip install -r v2/tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test synthetic terrain regression
        run: npm --prefix v2 run demo:test
      - name: Test provider integration with deterministic HTTP fixtures
        run: python v2/tests/browser/provider_smoke.py
      - name: Test combined site and public-site token fallback with fixtures
        env:
          ZERANA_MOCK_MAPBOX: '1'
        run: python v2/tests/browser/preview_smoke.py
      - name: Test metric player, collision, input and floating origin
        run: python v2/tests/browser/player_smoke.py
      - name: Test streaming workers, metre windows, cache and mocked network
        run: python v2/tests/browser/streaming_smoke.py
      - name: Test sliding window, hot recycling and delayed replacement
        run: python v2/tests/browser/sliding_window_smoke.py
      - name: Test automatic experience, prepared colliders and timed memory probes
        env:
          ZERANA_SOAK_SECONDS: '120'
        run: python v2/tests/browser/experience_smoke.py
      - name: Retain preview and sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-public-preview-and-evidence
          path: |
            dist/
            v2/browser-results/
          retention-days: 7
          if-no-files-found: warn
