name: Stage 8 source snapshot
on:
  push:
    branches: [work/stage8-source-snapshot]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f72ad1d40d5605005fd90149faf77a8bbb4c935
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: stage8-baseline-source
          path: source.tar
          retention-days: 1
